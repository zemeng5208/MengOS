[package]
name = "feather-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MengOS 的终端（GTK4 + VTE4）"

[[bin]]
name = "feather-terminal"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4" }
# gtk_v4_18：vte4 0.10 的生成代码用到 gtk::Accessible 等 v4_18 才导出的类型；
# Debian trixie 自带 GTK 4.18.6，满足该特性对系统库的要求。
vte4 = { version = "0.10.0", features = ["gtk_v4_18"] }
