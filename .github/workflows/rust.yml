name: rust
on:
  push:
    branches: ["**"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: rust:1.100.0-trixie
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: 安装 GTK4 / VTE4 开发库
        run: apt-get update && apt-get install -y libgtk-4-dev libvte-2.91-gtk4-dev pkg-config
      - name: 显示工具链与系统库版本
        run: |
          cargo --version
          rustc --version
          dpkg-query -W -f='${Package} ${Version}\n' libgtk-4-dev libvte-2.91-gtk4-dev pkg-config
          pkg-config --modversion gtk4
          pkg-config --modversion vte-2.91-gtk4
      - name: 检查 gtk4 版本与 VTE 绑定 API（临时步骤，任务完成后删除）
        run: |
          echo "===== cargo tree -i gtk4 ====="
          cargo tree -i gtk4 || true
          echo "===== vte4 源码里的相关 API ====="
          cargo fetch >/dev/null 2>&1 || true
          VTE_DIR=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name 'vte4-0.10.0' 2>/dev/null | head -1)
          echo "vte4 源码目录: ${VTE_DIR:-未找到}"
          if [ -n "$VTE_DIR" ]; then
            grep -rn "child_exited\|copy_clipboard\|paste_clipboard" "$VTE_DIR/src/" | head -30 || true
            grep -rn "pub enum Format" "$VTE_DIR/src/auto/enums.rs" || true
          fi
      - name: 安装 rustfmt 与 clippy
        run: rustup component add rustfmt clippy
      - name: 编译 release 版 FeatherTerminal
        run: cargo build --release -p feather-terminal
      - name: Clippy（警告当作错误）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 检查格式
        run: cargo fmt --all -- --check
      - name: 单元测试
        run: cargo test --workspace
      - name: 上传 FeatherTerminal 二进制
        uses: actions/upload-artifact@v4
        with:
          name: feather-terminal
          path: rust/target/release/feather-terminal
